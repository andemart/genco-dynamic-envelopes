# gridfm-datakit config: OPF training data for GENCO on GOC 500.
# Based on gridfm-datakit scripts/config/default.yaml.
network:
  name: "pglib_opf_case500_goc"
  source: "pglib"

load:
  generator: "agg_load_profile"
  agg_profile: "default"
  scenarios: 20000
  sigma: 0.2
  change_reactive_power: true
  global_range: 0.4
  max_scaling_factor: 4.0
  step_size: 0.1
  start_scaling_factor: 1.0

topology_perturbation:
  type: "random"
  k: 1
  n_topology_variants: 5
  elements: [branch, gen]

generation_perturbation:
  type: "cost_permutation"
  sigma: 1.0

admittance_perturbation:
  type: "none"

settings:
  num_processes: 16
  data_dir: "./data_out"
  large_chunk_size: 1000
  overwrite: true
  mode: "opf"
  include_dc_res: true
  enable_solver_logs: false
  pf_fast: true
  dcpf_fast: true
  max_iter: 200
  seed: 42
