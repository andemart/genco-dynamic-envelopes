# Amendment 4b: GENCO masked reconstruction on case33bw as the state estimator. graphkit PowerFlow task with random
# masking (PD, QD, VM, VA, QG independently at ratio 0.5) on GNS_heterogeneous_lv_recon: the LV variant plus a head
# that predicts [PD, QD] directly; bus output [Vm, Va, Pg, Qg, PD, QD]; loss MaskedReconstructionMSE.
# Data: the amendment 3 PF states (data_out/datakit_case33, splits by day). Measurement noise at inference only.
# Hydra A100: sbatch scripts/hydra_train.slurm configs/genco_ser_case33_lv.yaml data_out/datakit_case33 genco_ser_case33_lv
version: 1
callbacks:
  patience: 12
  tol: 0
  early_stopping_monitor: Validation loss
  checkpoint_monitor: Validation loss
  lr_scheduler_monitor: Validation loss
task:
  task_name: PowerFlow
data:
  baseMVA: 1
  mask_value: 0.0
  mask_type: rnd
  mask_ratio: 0.5
  normalization: HeteroDataMVANormalizer
  networks:
  - case33bw_opf
  scenarios:
  - 20000  # ignored: split_from_existing_files sets the scenarios
  test_ratio: 0.1
  val_ratio: 0.1
  workers: 8
  split_by_load_scenario_idx: false
  stream_partitions: auto
  split_from_existing_files: data_out/datakit_case33/splits
model:
  attention_head: 8
  edge_dim: 10
  hidden_size: 12
  input_bus_dim: 15
  input_gen_dim: 6
  output_bus_dim: 2
  output_gen_dim: 1
  num_layers: 12
  type: GNS_heterogeneous_lv_recon
  linear_prior: false
optimizer:
  type: AdamW
  learning_rate: 0.0005
  optimizer_params:
    betas:
    - 0.9
    - 0.999
  scheduler_type: ReduceLROnPlateau
  scheduler_params:
    mode: min
    factor: 0.7
    patience: 5
seed: 0
training:
  batch_size: 64
  epochs: 80
  losses:
  - MaskedReconstructionMSE
  loss_weights:
  - 1.0
  loss_args:
  - {}
  physics_warmup_epochs: 0
  accelerator: auto
  devices: 1
  strategy: auto
verbose: true
