# GENCO (graphkit GNS_heterogeneous) in power flow mode, trained from scratch on
# ENWL1 states built from Fluvius meters (python -m gencodoe.datakit_fluvius).
# Adapted from gridfm-graphkit examples/config/HGNS_PF_datakit_case118.yaml.
# Changes: Tiny width (hidden_size 12), baseMVA 1 (the ENWL1 case base),
# fewer workers/epochs for a laptop (Apple M4, MPS).
#
# The first ENWL1 run used 0.1 LayeredWeightedPhysics + 0.9 MaskedBusMSE.
# Its initial physics residual (~1,555) overwhelmed the voltage target (~0.4)
# and drove the model to the trivial near-zero-voltage solution. Train the
# voltage surrogate with supervised Vm/Va loss first. A physics term may be
# introduced only in a later, low-weight fine-tuning stage after checking the
# actual p.u. voltage error and power-balance residual of this checkpoint.
version: 1
callbacks:
  patience: 20
  tol: 0
  early_stopping_monitor: Validation loss
  checkpoint_monitor: Validation loss
  lr_scheduler_monitor: Validation loss
task:
  task_name: PowerFlow
data:
  baseMVA: 1
  mask_value: 0.0
  normalization: HeteroDataMVANormalizer
  networks:
  - enwl1_fluvius
  scenarios:
  - 20000
  test_ratio: 0.1
  val_ratio: 0.1
  workers: 4
  split_by_load_scenario_idx: true
  stream_partitions: auto
model:
  attention_head: 8
  edge_dim: 10
  hidden_size: 12
  input_bus_dim: 15
  input_gen_dim: 6
  output_bus_dim: 2
  output_gen_dim: 1
  num_layers: 12
  type: GNS_heterogeneous
optimizer:
  type: AdamW
  learning_rate: 0.0005
  optimizer_params:
    betas: [0.9, 0.999]
  scheduler_type: ReduceLROnPlateau
  scheduler_params:
    mode: min
    factor: 0.7
    patience: 5
seed: 0
training:
  batch_size: 64
  epochs: 60
  losses:
  - MaskedBusMSE
  loss_weights:
  - 1.0
  loss_args:
  - {}
  physics_warmup_epochs: 0
  accelerator: auto
  devices: 1
  strategy: auto
verbose: true
