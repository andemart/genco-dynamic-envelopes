# gridfm-datakit config: power flow (PF) training data for GENCO on a radial
# distribution feeder (Baran & Wu 33-bus, MATPOWER case33bw).
# Based on gridfm-datakit scripts/config/default.yaml.
#
# grids/case33bw.m is written by scripts/export_case33bw.py (per unit, with
# thermal ratings). datakit's load generator only scales loads up, so this set
# is the graph template and a PowerModels cross-check of our AC sweep; the
# GENCO training rows (net export and import) come from scripts/make_training_data.py.
network:
  name: "case33bw"
  source: "file"
  network_dir: "./grids"

load:
  generator: "agg_load_profile"
  agg_profile: "default"
  scenarios: 200
  sigma: 0.3
  change_reactive_power: true
  global_range: 0.6
  max_scaling_factor: 2.0
  step_size: 0.1
  start_scaling_factor: 1.0

topology_perturbation:
  type: "none"                # radial feeder; reconfiguration is out of scope

generation_perturbation:
  type: "none"

admittance_perturbation:
  type: "none"

settings:
  num_processes: 4
  data_dir: "./data_out"      # gitignored; move to ~/gencodoe_work if the repo sits in a synced folder
  large_chunk_size: 100
  overwrite: true
  mode: "pf"
  include_dc_res: false
  enable_solver_logs: false
  pf_fast: true
  dcpf_fast: true
  max_iter: 200
  seed: 42
