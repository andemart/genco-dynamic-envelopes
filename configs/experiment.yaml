# Experiment settings for the probabilistic screening study.
grid: pglib_opf_case500_goc
n_regions: 4                  # buses grouped into regions for forecast mapping
scenarios_per_hour: 1000
horizon_hours: [1, 6, 24]     # lead times studied

forecast_rel_std:             # relative error std at each lead time
  load: {1: 0.015, 6: 0.03, 24: 0.05}
  wind: {1: 0.08, 6: 0.18, 24: 0.30}
  pv:   {1: 0.06, 6: 0.15, 24: 0.25}

correlation:
  rho_regions: 0.6
  rho_wind_pv: -0.1

res_share:                    # share of generators re-tagged as wind / PV
  wind: 0.15
  pv: 0.10

conformal:
  alpha: 0.05
  per_line: false
  calibration_scenarios: 2000

model:
  variant: tiny               # tiny | small | base
