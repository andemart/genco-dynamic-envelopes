# Experiment settings for probabilistic dynamic operating envelopes.
feeder: case33bw              # case33bw (pandapower) | synthetic
ratings_headroom: 1.5         # thermal rating = headroom x |S| at peak load where the case has none
voltage_limits: see src/gencodoe/limits.py (absolute volts; UK 216.2-253.0 V on the 240.18 V base)

intervals: 48                 # half-hourly envelopes for one day
scenarios_per_interval: 1000
lead_times_hours: [1, 6, 24]  # day-ahead vs intraday envelopes

customers:                    # one flexible connection point per load bus
  export_cap_x_load: 2.0      # inverter export rating / nominal bus load
  import_cap_x_load: 1.0      # EV + battery import rating / nominal bus load
passive_pv_x_load: 0.5        # uncontrolled rooftop PV capacity / nominal bus load

forecast_rel_std:             # relative error std at each lead time
  load: {1: 0.03, 6: 0.06, 24: 0.10}
  pv:   {1: 0.08, 6: 0.18, 24: 0.30}

correlation:
  rho_within: {load: 0.5, pv: 0.9}
  rho_cross: 0.0

envelope:
  eps: 0.05                   # allowed share of scenarios with a violation
  policies: [uniform, proportional, max_total]
  directions: [export, import]
  levels_per_round: 8         # k-section search: candidate levels per batched GENCO call

conformal:
  alpha: 0.01
  per_element: false
  calibration_rows: 5000

model:
  variant: tiny               # tiny | small | base
