[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gencodoe"
version = "0.0.1"
description = "Four-wire-gated dynamic operating envelopes: extending GENCO to three-phase four-wire LV networks (GridFM GENCO Challenge 2026)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "pyyaml>=6.0", "tabulate>=0.9", "scikit-learn>=1.3"]

[project.optional-dependencies]
genco = ["gridfm-datakit", "gridfm-graphkit"]
feeders = ["pandapower>=2.13"]
unbalanced = ["opendssdirect.py>=0.9"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv]
# torch-scatter (pulled in by gridfm-graphkit) imports torch in its setup.py, so it cannot build in an
# isolated build environment. Install everything else first, then build it against the installed torch:
#   uv sync --all-extras --no-install-package torch-scatter && uv sync --all-extras
no-build-isolation-package = ["torch-scatter"]
